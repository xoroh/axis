name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        # Scoped to tests/: bare `bun test` would also pick up the
        # vitest-style package suites (which need jsdom) and fail
        # spuriously. Package suites run in Test package below.
        run: bun run test
      - name: Lint and format check
        run: bun run lint
      - name: Typecheck package
        run: bun run --filter @xoroh/axis typecheck
      - name: Test package
        run: bun run --filter @xoroh/axis test
      - name: Test package on React Native
        run: bun run --filter @xoroh/axis test:jest
      - name: Check package boundary
        # The gate and its own mutation suite both run: a boundary whose
        # tests do not execute is a comment, not a gate.
        run: |
          bun run --filter @xoroh/axis check:boundary
          bun test packages/axis/scripts/lib/boundary-policy.test.mjs
      - name: Build package
        run: bun run --filter @xoroh/axis build
      - name: Check package publishing
        run: bun run --filter @xoroh/axis check:publish
