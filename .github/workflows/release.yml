name: Release

# Publishing is owner-authorized only. This workflow NEVER runs on
# push: it starts solely from a manual dispatch, and even then it
# stops unless ALL of these hold:
#   - the `npm-publish` environment approves (human approver +
#     isolated write token),
#   - the `RELEASE_CHANGESSETS` repository variable is 'true'
#     (the release HOLD switch — absent/false by default).
# Until the first release is authorized, every run exits before
# touching the registry. See docs/RELEASING.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format check
        # The verify job mirrors CI's package gates so a manual
        # dispatch can never publish a red tree (CI gates PRs, but
        # this workflow dispatches straight from a branch).
        run: bun run lint

      - name: Typecheck package
        run: bun run --filter @xoroh/axis typecheck

      - name: Test package
        run: bun run --filter @xoroh/axis test

      - name: Test package on React Native
        run: bun run --filter @xoroh/axis test:jest

      - name: Check package boundary
        run: |
          bun run --filter @xoroh/axis check:boundary
          bun test packages/axis/scripts/lib/boundary-policy.test.mjs

      - name: Check README section discipline
        run: bun run --filter @xoroh/axis check:readme

      - name: Check README examples accuracy
        run: bun run --filter @xoroh/axis check:readme-examples

      - name: Build publishable package
        run: bun run build

      - name: Verify publishable package
        run: bun run --filter @xoroh/axis check:publish

  release:
    needs: verify
    # Triple gate: manual dispatch (workflow-level) + this var (the
    # HOLD switch) + the environment below (human approval, write
    # token isolated to this job). Keep all three; each one alone is
    # a mistake away from an unauthorized publish.
    # Provenance does NOT come from an env var here: `changeset
    # publish` passes only --access/--tag to `npm publish` (verified
    # in @changesets/cli dist/getPublishPlan.mjs), so the attestation
    # comes from publishConfig.provenance in packages/axis/package.json
    # plus the id-token:write permission below (Sigstore signing).
    # Auth is token-based (NPM_TOKEN secret), NOT OIDC trusted
    # publishing — that switch is owner-authorized and not set up here.
    if: ${{ vars.RELEASE_CHANGESSETS == 'true' }}
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
