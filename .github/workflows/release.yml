name: Release

# Publishing is owner-authorized only. This workflow NEVER runs on
# push: it starts solely from a manual dispatch, and even then it
# stops unless ALL of these hold:
#   - the `npm-publish` environment approves (human approver),
#   - the `RELEASE_CHANGESSETS` repository variable is 'true'
#     (the release HOLD switch — absent/false by default).
# Releases use npm Trusted Publishing (OIDC tokenless exchange)
# with Sigstore provenance attestation. See docs/RELEASING.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format check
        # The verify job mirrors CI's package gates so a manual
        # dispatch can never publish a red tree (CI gates PRs, but
        # this workflow dispatches straight from a branch).
        run: bun run lint

      - name: Typecheck package
        run: bun run --filter @xoroh/axis typecheck

      - name: Test package
        run: bun run --filter @xoroh/axis test

      - name: Test package on React Native
        run: bun run --filter @xoroh/axis test:jest

      - name: Check package boundary
        run: |
          bun run --filter @xoroh/axis check:boundary
          bun test packages/axis/scripts/lib/boundary-policy.test.mjs

      - name: Check README section discipline
        run: bun run --filter @xoroh/axis check:readme

      - name: Check README examples accuracy
        run: bun run --filter @xoroh/axis check:readme-examples

      - name: Build publishable package
        run: bun run build

      - name: Verify publishable package
        run: bun run --filter @xoroh/axis check:publish

  release:
    needs: verify
    # Triple gate: manual dispatch (workflow-level) + this var (the
    # HOLD switch) + the environment below (human approval).
    # Provenance and publishing auth use npm Trusted Publishing via OIDC:
    # `id-token: write` enables GitHub to issue the OIDC token which
    # npm CLI exchanges for a short-lived publication token.
    if: ${{ vars.RELEASE_CHANGESSETS == 'true' }}
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Tags and GitHub releases follow the axis-v<version> convention
          # (docs/RELEASING.md steps 6-7); the action adds none of its own.
          push-git-tags: false
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
