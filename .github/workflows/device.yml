name: Device smoke

# Builds apps/example natively and boots it on a simulator/emulator with
# no signing, no secrets and no paid services. Debug builds load their JS
# from a Metro bundler running on the same runner (adb reverse on Android,
# shared localhost on the iOS simulator). Each job asserts the app process
# stays alive on the home screen and uploads a screenshot artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-smoke:
    name: iOS simulator smoke
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Cache bun store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-macos-${{ hashFiles('bun.lock') }}
          restore-keys: bun-macos-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create and boot a simulator
        # Fully dynamic: no hardcoded device or runtime names, so the job
        # survives Xcode image upgrades on macos-latest.
        run: |
          SIM_DT=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone"))][0].identifier')
          SIM_RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS")][0].identifier')
          echo "device-type=$SIM_DT runtime=$SIM_RT"
          UDID=$(xcrun simctl create AxisSmoke "$SIM_DT" "$SIM_RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p "$GITHUB_WORKSPACE/device-shots"
      - name: Expo prebuild (iOS)
        run: |
          cd apps/example
          npx expo prebuild --platform ios --non-interactive --no-install
      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/example/ios/Pods
          key: ios-pods-${{ hashFiles('apps/example/ios/Podfile.lock') }}
          restore-keys: ios-pods-
      - name: Install pods
        run: |
          cd apps/example/ios
          pod install
      - name: Start Metro
        run: |
          cd apps/example
          npx expo start --non-interactive > "$GITHUB_WORKSPACE/metro-ios.log" 2>&1 &
          for _ in $(seq 1 36); do
            curl -sf http://127.0.0.1:8081/status && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8081/status
      - name: Build for the simulator
        # Simulator builds need no signing identity: CODE_SIGNING_ALLOWED=NO.
        run: |
          cd apps/example/ios
          xcodebuild \
            -workspace AxisExample.xcworkspace \
            -scheme AxisExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO
      - name: Install, launch, screenshot
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/AxisExample.app"
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" org.xoroh.axis.example
          sleep 25
          xcrun simctl spawn "$UDID" launchctl list | grep org.xoroh.axis.example
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/device-shots/home-ios.png"
          ls -la "$GITHUB_WORKSPACE/device-shots/"
      - name: Upload home-screen screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-home
          path: device-shots/home-ios.png
          if-no-files-found: error

  android-smoke:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Cache bun store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('bun.lock') }}
          restore-keys: bun-linux-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Expo prebuild (Android)
        run: |
          cd apps/example
          npx expo prebuild --platform android --non-interactive
      - name: Install emulator system libraries
        # The ubuntu-24.04 image lacks libpulse, which qemu links against
        # even with -no-audio; without it the emulator never boots.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
      - name: Build, boot and screenshot on the emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim
          script: |
            mkdir -p "$GITHUB_WORKSPACE/device-shots"
            adb reverse tcp:8081 tcp:8081
            cd apps/example
            npx expo start --non-interactive > "$GITHUB_WORKSPACE/metro-android.log" 2>&1 &
            for _ in $(seq 1 36); do
              curl -sf http://127.0.0.1:8081/status && break
              sleep 5
            done
            curl -sf http://127.0.0.1:8081/status
            cd android
            ./gradlew assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p org.xoroh.axis.example -c android.intent.category.LAUNCHER 1
            sleep 25
            # The app process must be alive: it reached the home screen and stayed up.
            adb shell pidof org.xoroh.axis.example
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/device-shots/home-android.png"
            ls -la "$GITHUB_WORKSPACE/device-shots/"
            # The home screen lists the demo families under an "Axis examples" header.
            HOME_OK=0
            for _ in $(seq 1 12); do
              adb shell uiautomator dump /sdcard/axis-ui.xml > /dev/null
              adb pull /sdcard/axis-ui.xml "$RUNNER_TEMP/axis-ui.xml" > /dev/null
              grep -o "Axis examples" "$RUNNER_TEMP/axis-ui.xml" && { HOME_OK=1; break; }
              sleep 5
            done
            test "$HOME_OK" = "1"
      - name: Upload home-screen screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-home
          path: device-shots/home-android.png
          if-no-files-found: error
